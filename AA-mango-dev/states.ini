; ================================================================
;  AA mango - single-state test catalog
;
;  Run one with:
;     AutoHotkey64.exe TestState.ahk <Section>
;
;  fn      = the AHK function in Lib\GameMango.ahk that gets called
;  timeout = ms before the watchdog aborts the state
;  expect  = what a PASS looks like (this is the ground truth the
;            agent cannot invent, so keep it accurate)
;
;  Sections are ordered from "safe, read-only" to "changes the game".
;  Start at the top when something is broken.
; ================================================================

[CheckLobby]
fn=CheckLobby
timeout=20000
expect=returns true only when the lobby UI is on screen; no clicks, no keys

[CheckLoaded]
fn=CheckLoaded
timeout=30000
expect=returns true when the map finished loading; no clicks, no keys

[DetectMap]
fn=DetectMap
timeout=45000
expect=log line names a map; fails loudly if no map template matches

[IsModeCancelOpen]
fn=IsModeCancelOpen
timeout=15000
expect=out params = x,y of the red cancel button when the mode panel is open

[CloseChat]
fn=CloseChat
timeout=20000
expect=chat box closes; chat icon returns to its idle state

[ClosePlayerLeaderBoard]
fn=ClosePlayerLeaderBoard
timeout=20000
expect=leaderboard closes; log says either found or not found, never both

[BasicSetup]
fn=BasicSetup
timeout=60000
expect=zoom + camera + UI reset done; game still in lobby

[Zoom]
fn=Zoom
timeout=30000
expect=camera zoom reaches the placement distance

[TpSpawn]
fn=TpSpawn
timeout=30000
expect=player is back at spawn point

[PlacementCamera]
fn=PlacementCamera
timeout=45000
expect=camera angle suitable for placing units

[PlacingUnits]
fn=PlacingUnits
timeout=120000
expect=every enabled unit slot gets placed; count in log matches settings

[UpgradeUnits]
fn=UpgradeUnits
timeout=120000
expect=each placed unit reaches max upgrade or the configured cap

[FindUnitPanel]
fn=FindUnitPanel
timeout=20000
expect=out params = x,y of the unit panel anchor

[UnitPlaced]
fn=UnitPlaced
timeout=20000
expect=returns true right after a successful placement

[FindMatch]
fn=FindMatch
timeout=90000
expect=matchmaking starts; no captcha prompt

[PlayHere]
fn=PlayHere
timeout=30000
expect=clicks the Play button of the selected mode

[MonitorStage]
fn=MonitorStage
timeout=180000
expect=stage loop progresses; returns when the stage ends

[MonitorEndScreen]
fn=MonitorEndScreen
timeout=120000
expect=victory/defeat screen handled; back to lobby

[CheckEndAndRoute]
fn=CheckEndAndRoute
timeout=60000
expect=picks the next action after a stage ends

[CheckForXp]
fn=CheckForXp
timeout=30000
expect=xp bar read; no false positives when the bar is absent

[StoryMovement]
fn=StoryMovement
timeout=60000
expect=clicks Play then walks to the map portal
note=THIS ONE USES CoordMode Screen for its click - see README risks

[FarmMovement]
fn=FarmMovement
timeout=60000
expect=clicks Play then walks to the map portal
note=THIS ONE USES CoordMode Screen for its click - see README risks
